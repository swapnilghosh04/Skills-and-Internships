<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level 3 — Task 1: CSS Auto Slideshow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>Pure CSS Automatic Slideshow</h1>
    </div>
  </header>
  <main class="container">
    <section class="card">
      <p>The slideshow below cycles between images automatically using only CSS animations. Hover to pause.</p>
      <div class="stage">
        <img src="https://picsum.photos/id/1015/1600/900" alt="Slide 1 — Mountain lake" />
        <img src="https://picsum.photos/id/1043/1600/900" alt="Slide 2 — Sea cliffs" />
        <img src="https://picsum.photos/id/1035/1600/900" alt="Slide 3 — Desert dunes" />
      </div>
    </section>
  </main>
</body>
</html>
